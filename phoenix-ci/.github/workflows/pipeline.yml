name: Phoenix pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NODE_VERSION: "20"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phoenix-backend
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-backend-${{ hashFiles('phoenix-backend/package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
        env:
          MONGODB_URI: mongodb://localhost:27017/phoenix_test
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: phoenix-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-frontend-${{ hashFiles('phoenix-frontend/package-lock.json') }}
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, frontend]
    services:
      mongo:
        image: mongo:6
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          restore-keys: |
            npm-backend-
            npm-frontend-
          key: npm-e2e-${{ hashFiles('phoenix-backend/package-lock.json', 'phoenix-frontend/package-lock.json') }}
      - name: Install backend
        working-directory: phoenix-backend
        run: npm ci
      - name: Build backend
        working-directory: phoenix-backend
        run: npm run build
      - name: Seed database
        working-directory: phoenix-backend
        run: npm run seed
        env:
          MONGODB_URI: mongodb://localhost:27017/phoenix_e2e
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
      - name: Start backend
        working-directory: phoenix-backend
        run: npm start &
        env:
          MONGODB_URI: mongodb://localhost:27017/phoenix_e2e
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          CORS_ORIGINS: http://localhost:3000
          PORT: 8000
      - name: Install frontend
        working-directory: phoenix-frontend
        run: npm ci
      - name: Build frontend
        working-directory: phoenix-frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Start frontend
        working-directory: phoenix-frontend
        run: npm start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
      - name: Wait for backend
        run: bash phoenix-ci/scripts/wait-for.sh http://localhost:8000/api/health
      - name: Wait for frontend
        run: bash phoenix-ci/scripts/wait-for.sh http://localhost:3000
      - name: Run smoke tests
        run: bash phoenix-ci/scripts/smoke.sh http://localhost:8000 http://localhost:3000

  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm install --global vercel@32
      - name: Deploy backend
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }} --env APP_VERSION=${{ github.sha }}
        working-directory: phoenix-backend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_BACKEND_PROJECT_ID }}
      - name: Deploy frontend
        run: vercel deploy --prod --token ${{ secrets.VERCEL_TOKEN }} --scope ${{ secrets.VERCEL_ORG_ID }}
        working-directory: phoenix-frontend
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_FRONTEND_PROJECT_ID }}

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy]
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test production
        run: bash phoenix-ci/scripts/smoke.sh ${{ vars.BACKEND_URL }} ${{ vars.FRONTEND_URL }} ${{ github.sha }}
