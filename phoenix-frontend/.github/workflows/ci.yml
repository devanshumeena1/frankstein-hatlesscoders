name: Frontend CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@master
      - uses: actions/setup-node@main
        with:
          node-version: "16"
      - run: npm install --legacy-peer-deps
      - run: npm run build
        continue-on-error: true
